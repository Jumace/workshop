pre-commit:
  parallel: false
  commands:
    format:
      glob: "*.{ts,tsx,js,jsx,json,md,mdx,css,yml,yaml}"
      exclude:
        - app/lib/content.generated.ts
        - lib/content-metadata.generated.ts
      run: pnpm exec oxfmt --write {staged_files} && git add {staged_files}
    spelling:
      glob: "*.{md,mdx}"
      run: pnpm spelling:check
    content:
      run: pnpm validate:content
    lint:
      run: pnpm lint
    typecheck:
      run: pnpm typecheck
